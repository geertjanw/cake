apiVersion: apps/v1
kind: Deployment
metadata:
  name: party-service
  namespace: cake-and-candles
spec:
  replicas: 1
  selector:
    matchLabels: { app: party-service }
  template:
    metadata:
      labels: { app: party-service }
    spec:
      containers:
        - name: party-service
          image: cake-and-candles/party-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: otel-shared }
            - secretRef: { name: dash0 }
          env:
            - name: OTEL_SERVICE_NAME
              value: party-service
            # In-cluster DNS: the Service names below resolve to the other pods.
            - name: CAKE_SERVICE_URL
              value: http://cake-service:8081
            - name: INVITATION_SERVICE_URL
              value: http://invitation-service:8082
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: party-service
  namespace: cake-and-candles
spec:
  selector: { app: party-service }
  ports: [{ port: 8080, targetPort: 8080 }]
