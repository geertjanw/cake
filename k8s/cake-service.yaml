apiVersion: apps/v1
kind: Deployment
metadata:
  name: cake-service
  namespace: cake-and-candles
spec:
  replicas: 1
  selector:
    matchLabels: { app: cake-service }
  template:
    metadata:
      labels: { app: cake-service }
    spec:
      containers:
        - name: cake-service
          image: cake-and-candles/cake-service:latest
          imagePullPolicy: IfNotPresent   # use the locally loaded image, don't pull
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: otel-shared }   # OTLP endpoint, exporters, etc.
            - secretRef: { name: dash0 }             # OTEL_EXPORTER_OTLP_HEADERS (token)
          env:
            - name: OTEL_SERVICE_NAME
              value: cake-service
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cake-service
  namespace: cake-and-candles
spec:
  selector: { app: cake-service }
  ports: [{ port: 8081, targetPort: 8081 }]
