apiVersion: apps/v1
kind: Deployment
metadata:
  name: invitation-service
  namespace: cake-and-candles
spec:
  replicas: 1
  selector:
    matchLabels: { app: invitation-service }
  template:
    metadata:
      labels: { app: invitation-service }
    spec:
      containers:
        - name: invitation-service
          image: cake-and-candles/invitation-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8082 }]
          envFrom:
            - configMapRef: { name: otel-shared }
            - secretRef: { name: dash0 }
          env:
            - name: OTEL_SERVICE_NAME
              value: invitation-service
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8082 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: invitation-service
  namespace: cake-and-candles
spec:
  selector: { app: invitation-service }
  ports: [{ port: 8082, targetPort: 8082 }]
