spring:
  application:
    name: cake-service
  datasource:
    url: jdbc:h2:mem:bakery;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false

server:
  port: 8081

bakery:
  cake:
    # The flavors we serve. Anything else is rejected with 400 rather than sanitised,
    # because cake.flavor is a metric attribute and every distinct value is a time series
    # that sticks around. Keep in sync with data.sql, which seeds the stock levels.
    flavors: chocolate,vanilla,strawberry,lemon
  oven:
    max-candles: 80      # anything above this makes the oven time out
    millis-per-candle: 25

management:
  endpoints:
    web:
      exposure:
        include: health,info
